<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dilmurod Muhsinjonov — Software, Automation and Digital Systems</title>
  <desc id="desc">Quiet Authority Obsidian and Champagne Gold editorial profile banner featuring orbital geometry and a liquid metallic sphere.</desc>
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="orbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.10"/>
      <stop offset="65%" stop-color="#C9A86A" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="axisLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="orbitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#C9A86A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="sphereBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#34363B"/>
      <stop offset="48%" stop-color="#17181B"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <radialGradient id="sphereSpecular" cx="30%" cy="26%" r="44%">
      <stop offset="0%" stop-color="#F1F1EE" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#F1F1EE" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F1F1EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereGoldRim" cx="76%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#C9A86A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F1EE" stop-opacity="0.36"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="6" fill="url(#bgCanvas)" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Architectural precision hairlines -->
  <line x1="760" y1="28" x2="760" y2="332" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <line x1="760" y1="180" x2="1199" y2="180" stroke="url(#axisLine)"/>
  <line x1="985" y1="28" x2="985" y2="332" stroke="#FFFFFF" stroke-opacity="0.04"/>

  <text x="1152" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.6" fill="#767676">41.2995&#176; N &#183; 69.2401&#176; E</text>

  <!-- Left editorial zone -->
  <rect x="56" y="50" width="24" height="2" rx="1" fill="#C9A86A"/>
  <text x="92" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.6" fill="#B9BDC2">SOFTWARE &#183; AUTOMATION &#183; DIGITAL SYSTEMS</text>

  <text x="54" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" letter-spacing="-1.4" fill="#F1F1EE">Dilmurod</text>
  <text x="54" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" letter-spacing="-1.4" fill="#C9A86A">Muhsinjonov</text>

  <text x="56" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#B9BDC2">Turning ideas into deliberate, useful tools and systems.</text>

  <line x1="56" y1="292" x2="712" y2="292" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.8" fill="#767676">TASHKENT, UZBEKISTAN</text>
  <text x="712" y="322" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.8" fill="#767676">TIU &#183; INFORMATION SYSTEMS</text>

  <!-- Right orbital centerpiece -->
  <g transform="translate(985 180)">
    <circle r="170" fill="url(#orbAura)"/>
    <circle r="126" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <ellipse rx="144" ry="42" transform="rotate(26)" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle r="86" fill="none" stroke="#C9A86A" stroke-opacity="0.24"/>

    <g transform="rotate(-26)">
      <ellipse rx="154" ry="46" fill="none" stroke="url(#orbitGold)" stroke-width="1.15"/>
      <circle cx="140.7" cy="18.7" r="3.5" fill="#C9A86A"/>
      <circle cx="-142.8" cy="-17.1" r="2.2" fill="#9FA4AB"/>
    </g>

    <!-- Liquid metallic obsidian sphere -->
    <circle r="64" fill="url(#sphereBase)"/>
    <circle r="64" fill="url(#sphereSpecular)"/>
    <circle r="64" fill="url(#sphereGoldRim)"/>
    <circle r="63.5" fill="none" stroke="url(#rimStroke)" stroke-width="1"/>
  </g>
</svg>
