<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dilmurod Muhsinjonov — Software, Automation and Digital Systems</title>
  <desc id="desc">Quiet Authority Swiss Warm Ivory editorial profile banner featuring orbital geometry and a brushed dark-bronze sphere.</desc>
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EEE6"/>
    </linearGradient>
    <radialGradient id="orbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E7B3B" stop-opacity="0.09"/>
      <stop offset="65%" stop-color="#9E7B3B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#9E7B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="axisLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7B3B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9E7B3B" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="orbitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E7B3B" stop-opacity="0.78"/>
      <stop offset="60%" stop-color="#9E7B3B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9E7B3B" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="sphereBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#46433E"/>
      <stop offset="50%" stop-color="#22201E"/>
      <stop offset="100%" stop-color="#11100F"/>
    </radialGradient>
    <radialGradient id="sphereSpecular" cx="30%" cy="26%" r="44%">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FAF8F5" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereGoldRim" cx="76%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#B5904E" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#B5904E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B5904E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#4E4D49" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B5904E" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="6" fill="url(#bgCanvas)" stroke="#DED8CC"/>

  <!-- Architectural precision hairlines -->
  <line x1="760" y1="28" x2="760" y2="332" stroke="#E2DCD0"/>
  <line x1="760" y1="180" x2="1199" y2="180" stroke="url(#axisLine)"/>
  <line x1="985" y1="28" x2="985" y2="332" stroke="#E2DCD0" stroke-opacity="0.65"/>

  <text x="1152" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.6" fill="#7A7770">41.2995&#176; N &#183; 69.2401&#176; E</text>

  <!-- Left editorial zone -->
  <rect x="56" y="50" width="24" height="2" rx="1" fill="#9E7B3B"/>
  <text x="92" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.6" fill="#4E4D49">SOFTWARE &#183; AUTOMATION &#183; DIGITAL SYSTEMS</text>

  <text x="54" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" letter-spacing="-1.4" fill="#141413">Dilmurod</text>
  <text x="54" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" letter-spacing="-1.4" fill="#9E7B3B">Muhsinjonov</text>

  <text x="56" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4E4D49">Turning ideas into deliberate, useful tools and systems.</text>

  <line x1="56" y1="292" x2="712" y2="292" stroke="#E2DCD0"/>

  <text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.8" fill="#7A7770">TASHKENT, UZBEKISTAN</text>
  <text x="712" y="322" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.8" fill="#7A7770">TIU &#183; INFORMATION SYSTEMS</text>

  <!-- Right orbital centerpiece -->
  <g transform="translate(985 180)">
    <circle r="170" fill="url(#orbAura)"/>
    <circle r="126" fill="none" stroke="#141413" stroke-opacity="0.10"/>
    <ellipse rx="144" ry="42" transform="rotate(26)" fill="none" stroke="#141413" stroke-opacity="0.12"/>
    <circle r="86" fill="none" stroke="#9E7B3B" stroke-opacity="0.28"/>

    <g transform="rotate(-26)">
      <ellipse rx="154" ry="46" fill="none" stroke="url(#orbitGold)" stroke-width="1.15"/>
      <circle cx="140.7" cy="18.7" r="3.5" fill="#9E7B3B"/>
      <circle cx="-142.8" cy="-17.1" r="2.2" fill="#7A7770"/>
    </g>

    <!-- Brushed dark-bronze satin obsidian sphere -->
    <circle r="64" fill="url(#sphereBase)"/>
    <circle r="64" fill="url(#sphereSpecular)"/>
    <circle r="64" fill="url(#sphereGoldRim)"/>
    <circle r="63.5" fill="none" stroke="url(#rimStroke)" stroke-width="1"/>
  </g>
</svg>
