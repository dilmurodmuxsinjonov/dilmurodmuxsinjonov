<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Engineering Telemetry</title>
  <desc id="desc">Self-hosted 12-month contribution ledger, 12-week cadence, and owned repository language mix.</desc>
  <defs>
    <linearGradient id="telemetryBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EEE6"/>
    </linearGradient>
    <clipPath id="langClip">
      <rect x="822" y="102" width="342" height="8" rx="4"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="263" rx="6" fill="url(#telemetryBg)" stroke="#DED8CC" stroke-opacity="1"/>

  <!-- Top bar -->
  <circle cx="36" cy="24" r="3" fill="#9E7B3B"/>
  <text x="48" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="2.2" fill="#4E4D49">GITHUB TELEMETRY &#183; 12-MONTH WINDOW</text>
  <text x="1164" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.4" fill="#7A7770">LAST ACTIVITY · 2026-11-26</text>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#E2DCD0" stroke-opacity="1"/>

  <!-- 3-Column Swiss grid dividers -->
  <line x1="410" y1="64" x2="410" y2="242" stroke="#E2DCD0" stroke-opacity="1"/>
  <line x1="790" y1="64" x2="790" y2="242" stroke="#E2DCD0" stroke-opacity="1"/>

  <!-- Column 1: Contribution Ledger -->
  <text x="36" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" letter-spacing="-1" fill="#141413">528</text>
  <text x="36" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7A7770">contributions across the last 12 months</text>

  <line x1="36" y1="198" x2="380" y2="198" stroke="#E2DCD0" stroke-opacity="1"/>

  <text x="36" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E4D49">Commits</text>
  <text x="190" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#141413">351</text>
  <text x="214" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E4D49">Pull Requests</text>
  <text x="380" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#141413">60</text>

  <text x="36" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E4D49">Issues</text>
  <text x="190" y="222" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#141413">57</text>
