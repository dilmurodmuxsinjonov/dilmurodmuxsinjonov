  <rect x="631" y="190" width="18" height="4" rx="2" fill="#E4DFD5"/>
  <rect x="658" y="188" width="18" height="6" rx="2" fill="#B2AEA5"/>
  <rect x="685" y="190" width="18" height="4" rx="2" fill="#E4DFD5"/>
  <rect x="712" y="185" width="18" height="9" rx="2" fill="#B2AEA5"/>
  <rect x="739" y="188" width="18" height="6" rx="2" fill="#B2AEA5"/>
