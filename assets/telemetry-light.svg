  <!-- Column 3: Language Mix -->
  <text x="822" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#4E4D49">LANGUAGE MIX</text>
  <text x="1164" y="82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#7A7770">OWNED REPOS</text>
