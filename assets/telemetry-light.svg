  <rect x="822" y="163" width="8" height="8" rx="2" fill="#5D5A54"/>
  <text x="837" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E4D49">HTML</text>
  <text x="982" y="172" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" fill="#141413">14.9%</text>
  <rect x="1004" y="163" width="8" height="8" rx="2" fill="#8A867E"/>
  <text x="1019" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#4E4D49">GDScript</text>
