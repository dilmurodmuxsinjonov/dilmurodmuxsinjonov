  <text x="837" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">TypeScript</text>
  <text x="982" y="206" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" fill="#F1F1EE">13.5%</text>
  <rect x="1004" y="197" width="8" height="8" rx="2" fill="#3E434C"/>
