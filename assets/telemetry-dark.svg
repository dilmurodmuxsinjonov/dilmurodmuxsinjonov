  <rect x="631" y="190" width="18" height="4" rx="2" fill="#222429"/>
  <rect x="658" y="180" width="18" height="14" rx="2" fill="#4A4E56"/>
  <rect x="685" y="190" width="18" height="4" rx="2" fill="#222429"/>
  <rect x="712" y="174" width="18" height="20" rx="2" fill="#4A4E56"/>
  <rect x="739" y="179" width="18" height="15" rx="2" fill="#4A4E56"/>
  <line x1="442" y1="196" x2="758" y2="196" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="442" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9699A0">21 public repositories · 39 stars</text>

  <!-- Column 3: Language Mix -->
  <text x="822" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#B9BDC2">LANGUAGE MIX</text>
  <text x="1164" y="82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#9699A0">OWNED REPOS</text>
