<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Engineering Telemetry</title>
  <desc id="desc">Self-hosted 12-month contribution ledger, 12-week cadence, and owned repository language mix.</desc>
  <defs>
    <linearGradient id="telemetryBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <clipPath id="langClip">
      <rect x="822" y="102" width="342" height="8" rx="4"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="263" rx="6" fill="url(#telemetryBg)" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- Top bar -->
  <rect x="36" y="23" width="16" height="2" rx="1" fill="#C9A86A"/>
  <text x="62" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="2.2" fill="#B9BDC2">GITHUB TELEMETRY &#183; 12-MONTH WINDOW</text>
  <text x="1164" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.4" fill="#9699A0">LAST ACTIVITY · 2026-11-26</text>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- 3-Column Swiss grid dividers -->
  <line x1="410" y1="64" x2="410" y2="242" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <line x1="790" y1="64" x2="790" y2="242" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Column 1: Contribution Ledger -->
  <text x="36" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" letter-spacing="-1" fill="#F1F1EE">540</text>
  <text x="36" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9699A0">contributions across the last 12 months</text>

  <line x1="36" y1="198" x2="380" y2="198" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="36" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">Commits</text>
  <text x="190" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#F1F1EE">359</text>
  <text x="214" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">Pull Requests</text>
  <text x="380" y="180" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#F1F1EE">62</text>

  <text x="36" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">Issues</text>
  <text x="190" y="222" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#F1F1EE">59</text>
  <text x="214" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">Reviews</text>
