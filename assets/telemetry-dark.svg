  <text x="442" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="2" fill="#B9BDC2">12-WEEK CADENCE</text>
  <text x="758" y="82" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#C9A86A">PEAK 195/WK</text>
