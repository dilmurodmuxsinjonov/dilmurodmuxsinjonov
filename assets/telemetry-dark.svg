  <text x="1164" y="138" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" fill="#F1F1EE">17.5%</text>
  <rect x="822" y="163" width="8" height="8" rx="2" fill="#A3A8B0"/>
  <text x="837" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">HTML</text>
  <text x="982" y="172" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" fill="#F1F1EE">14.9%</text>
  <rect x="1004" y="163" width="8" height="8" rx="2" fill="#6F747D"/>
  <text x="1019" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#B9BDC2">GDScript</text>
  <text x="1164" y="172" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" fill="#F1F1EE">14.8%</text>
